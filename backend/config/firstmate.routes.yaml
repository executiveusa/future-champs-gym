version: "2"
owner: Glenn
default_mode: no-mistakes
project_root: "${FUTURE_CHAMPS_PROJECT}"
source_of_truth:
  footage: "https://drive.google.com/drive/folders/1G3MUd8wWztOefuJex32AFnMe46IyJpR_?usp=sharing"
  code: github
  approvals: backend/state/approvals
routes:
  content_intake:
    allowed: [scan_drive, catalog_video, prepare_story_brief]
    requires_approval: false
  content_production:
    allowed: [prepare_riverside_project, request_transcript, prepare_short_package]
    requires_approval: false
  site_iteration:
    allowed: [inspect_site, audit_copy, update_wireframe, refresh_placeholders, improve_mobile, check_links, check_accessibility, run_gauntlet, prepare_pr]
    requires_approval: false
    boundaries:
      - no_unverified_public_claims
      - no_secret_changes
      - no_destructive_data_changes
      - preserve_routes_and_rollback
  independent_review:
    allowed: [review_user_value, review_design, review_mobile, review_accessibility, review_claims, review_rollback]
    requires_approval: false
    must_not_equal_builder: true
  publishing:
    allowed: [prepare_publish_packet, attach_approved_media, schedule_approved_post]
    requires_approval: true
  company_operations:
    allowed: [draft_update, draft_calendar, draft_partner_followup]
    requires_approval: true
  destructive:
    allowed: []
    requires_approval: true
    policy: refuse
handoff:
  input: "backend/state/inbox/*.json"
  output: "backend/state/reports/"
  worktrees: isolated
  merge:
    policy: independent_review_required
    auto_merge_non_destructive_site_prs: true
    publish_changes: owner_approval_required
