name: Round 8 HyperFrames motion proof (no deploy)
on:
  push:
    branches:
      - design/gyms-editorial-partner-first-2026-10-13
    paths:
      - 'motion/round8-intro/**'
      - 'assets/future-champs-round8.svg'
      - '.github/workflows/round8-motion-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round8-intro:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact original vector wordmark
        run: test -s assets/future-champs-round8.svg
      - name: Install FFmpeg and Chromium environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          test -x /usr/bin/ffmpeg
      - name: Stage canonical Round 8 vector inside render root
        run: |
          mkdir -p motion/round8-intro/assets
          cp assets/future-champs-round8.svg motion/round8-intro/assets/future-champs-round8.svg
          cmp assets/future-champs-round8.svg motion/round8-intro/assets/future-champs-round8.svg
      - name: Lint HyperFrames composition
        working-directory: motion/round8-intro
        run: npx --yes hyperframes@0.9.19 lint
      - name: Render brand identity draft (no site deployment)
        working-directory: motion/round8-intro
        run: npx --yes hyperframes@0.9.19 render --output round8-identity-v1.mp4
      - name: Probe render
        working-directory: motion/round8-intro
        run: |
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 round8-identity-v1.mp4
      - name: Save internal review MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round8-hyperframes-review
          path: motion/round8-intro/round8-identity-v1.mp4
          if-no-files-found: warn
          retention-days: 14
