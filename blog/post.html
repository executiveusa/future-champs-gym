<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Corner | Future Champs</title>
  <meta name="description" content="A story from The Corner, the Future Champs journal." />
  <meta name="robots" content="index,follow" />
  <style>
    :root{--red:#b31f2b;--black:#111;--bone:#f3eee7;--white:#fff;--gray:#6d7378;--line:rgba(17,17,17,.16)}
    *{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--black);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.68}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.reader{width:min(760px,calc(100% - 32px));margin:auto}.serif{font-family:Georgia,"Times New Roman",serif}.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;font-weight:800}.nav{position:sticky;top:0;z-index:20;background:rgba(243,238,231,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.navin{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-weight:900;letter-spacing:-.04em}.hero{padding:96px 0 64px;border-bottom:1px solid var(--line)}.hero h1{font-size:clamp(3.5rem,8vw,7rem);line-height:.9;letter-spacing:-.055em;margin:16px 0 24px}.dek{font-size:1.25rem;max-width:780px}.meta{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gray);font-weight:800}.article{padding:72px 0}.article h2{font-family:Georgia,"Times New Roman",serif;font-size:2.2rem;line-height:1.05;margin:2.1em 0 .6em}.article p{font-size:1.08rem}.article a{text-decoration:underline;text-underline-offset:3px}.callout{border-left:4px solid var(--red);padding:18px 22px;margin:42px 0;background:rgba(255,255,255,.35)}.back{display:inline-block;margin-top:28px;font-weight:800}.footer{padding:46px 0;background:var(--black);color:white}.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}.error{padding:80px 0;color:#7d1d25}@media(max-width:560px){.hero{padding-top:72px}.hero h1{font-size:3.7rem}.article{padding-top:52px}}
  </style>
</head>
<body>
  <header class="nav"><div class="wrap navin"><a class="brand" href="/">FUTURE CHAMPS</a><a href="/blog/"><b>THE CORNER</b></a></div></header>
  <main id="article-root"><section class="hero"><div class="reader"><div class="eyebrow">The Corner</div><h1 class="serif">Loading story…</h1></div></section></main>
  <footer class="footer"><div class="wrap foot"><div><b>THE CORNER</b><div>A Future Champs publication</div></div><div>Every young person deserves someone in their corner.</div><div><a href="/blog/">All stories</a></div></div></footer>

  <script>
    const SUPABASE_URL='https://cyxdevcjycmffhmwxojh.supabase.co';
    const SUPABASE_KEY='sb_publishable_PoqI-3PsCqewtJWJ0Z73Ag_5hIE0oKI';
    const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`};
    const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const date=value=>new Intl.DateTimeFormat('en-US',{year:'numeric',month:'long',day:'numeric'}).format(new Date(value));

    async function loadArticle(){
      const root=document.getElementById('article-root');
      const slug=new URLSearchParams(location.search).get('slug');
      if(!slug){root.innerHTML='<div class="reader error"><h1>Story not found.</h1><a class="back" href="/blog/">← Return to The Corner</a></div>';return;}
      try{
        const res=await fetch(`${SUPABASE_URL}/rest/v1/future_champs_corner_posts?slug=eq.${encodeURIComponent(slug)}&select=slug,title,dek,body_html,category,author_name,published_at,updated_at,metadata&limit=1`,{headers});
        if(!res.ok) throw new Error('Unable to load article');
        const rows=await res.json();
        if(!rows.length) throw new Error('Story not found');
        const post=rows[0];
        document.title=`${post.title} | The Corner`;
        const description=document.querySelector('meta[name="description"]');
        if(description) description.setAttribute('content',post.dek||'A story from The Corner.');
        const reading=post.metadata&&post.metadata.reading_time_minutes?`${post.metadata.reading_time_minutes} min read`:'Short read';
        root.innerHTML=`<section class="hero"><div class="reader"><div class="eyebrow">${esc(post.category.replaceAll('-',' '))}</div><h1 class="serif">${esc(post.title)}</h1><p class="dek">${esc(post.dek)}</p><div class="meta">${esc(post.author_name)} · ${date(post.published_at)} · ${reading}</div></div></section><article class="article"><div class="reader">${post.body_html}<div class="callout"><b>Future Champs is in its founding stage.</b><p>Program dates, locations, partnerships, pricing, and outcomes are published only after confirmation.</p></div><a class="back" href="/blog/">← Return to The Corner</a></div></article>`;
      }catch(err){root.innerHTML='<div class="reader error"><h1>Story unavailable.</h1><p>This article may have been moved or is still under review.</p><a class="back" href="/blog/">← Return to The Corner</a></div>';}
    }
    loadArticle();
  </script>
</body>
</html>
