<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Corner | Future Champs</title>
<meta name="description" content="A story from The Corner, the Future Champs editorial desk.">
<meta name="robots" content="index,follow">
<link rel="stylesheet" href="/assets/future-champs.css">
<style>
.reader{width:min(760px,calc(100% - 32px));margin:auto}.story-hero{padding:96px 0 64px;border-bottom:1px solid var(--line)}.story-hero h1{font-size:clamp(3.5rem,8vw,7rem);line-height:.9;letter-spacing:-.055em;margin:16px 0 24px}.dek{font-size:1.25rem;max-width:760px}.article{padding:72px 0}.article h2{font-family:Georgia,"Times New Roman",serif;font-size:2.2rem;line-height:1.05;margin:2.1em 0 .6em}.article p{font-size:1.08rem}.article a{text-decoration:underline;text-underline-offset:3px}.back{display:inline-block;margin-top:32px;font-weight:800}.error{padding:96px 0}.article img{height:auto}.article blockquote{margin:2rem 0;padding-left:20px;border-left:4px solid var(--red);font-family:Georgia,"Times New Roman",serif;font-size:1.35rem}@media(max-width:560px){.story-hero{padding:64px 0 48px}.story-hero h1{font-size:3.45rem}.article{padding:48px 0}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav"><div class="wrap navin"><a class="brand" href="/">FUTURE CHAMPS</a><nav class="links" aria-label="Primary"><a href="/watch/">Watch</a><a href="/fighters/">Fighters</a><a href="/gyms-and-corners/">Gyms + Corners</a><a href="/blog/">The Corner</a><a href="/about/">About</a></nav><a class="btn dark" href="/get-involved/">Get involved</a></div></header>
<main id="main"><section class="story-hero"><div class="reader"><div class="eyebrow">The Corner</div><h1 class="serif">Loading story…</h1></div></section></main>
<footer class="footer"><div class="wrap foot"><div><b>THE CORNER</b><div>A Future Champs publication</div></div><div>People before hype.</div><div><a href="/blog/">All stories</a> · <a href="/watch/">Watch</a></div></div></footer>
<script>
const SUPABASE_URL='https://cyxdevcjycmffhmwxojh.supabase.co';
const SUPABASE_KEY='sb_publishable_PoqI-3PsCqewtJWJ0Z73Ag_5hIE0oKI';
const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`};
const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const date=value=>new Intl.DateTimeFormat('en-US',{year:'numeric',month:'long',day:'numeric'}).format(new Date(value));
const ARTICLE_TAGS=new Set(['P','H2','H3','BLOCKQUOTE','STRONG','EM','B','I','UL','OL','LI','BR','A']);
function sanitizeArticleHTML(value){
 const doc=new DOMParser().parseFromString(`<body>${String(value??'')}</body>`,'text/html');
 const clean=node=>{
  for(const child of [...node.childNodes]){
   if(child.nodeType===Node.COMMENT_NODE){child.remove();continue;}
   if(child.nodeType!==Node.ELEMENT_NODE) continue;
   if(!ARTICLE_TAGS.has(child.tagName)){
    if(['SCRIPT','STYLE'].includes(child.tagName)){
     child.remove();
     continue;
    }
    const fragment=document.createDocumentFragment();
    while(child.firstChild) fragment.appendChild(child.firstChild);
    child.replaceWith(fragment);
    clean(node);
    continue;
   }
   const rawHref=child.tagName==='A'?child.getAttribute('href'):null;
   for(const attr of [...child.attributes]) child.removeAttribute(attr.name);
   if(rawHref){
    try{
     const url=new URL(rawHref,location.origin);
     if(['http:','https:'].includes(url.protocol)) child.setAttribute('href',rawHref);
    }catch(_){}
   }
   clean(child);
  }
 };
 clean(doc.body);
 return doc.body.innerHTML;
}
async function loadArticle(){
 const root=document.getElementById('main');
 const slug=new URLSearchParams(location.search).get('slug');
 if(!slug){root.innerHTML='<div class="reader error"><h1 class="serif">Story not found.</h1><a class="back" href="/blog/">← Return to The Corner</a></div>';return;}
 try{
  const res=await fetch(`${SUPABASE_URL}/rest/v1/future_champs_corner_posts?slug=eq.${encodeURIComponent(slug)}&select=slug,title,dek,body_html,category,author_name,published_at,updated_at,metadata&limit=1`,{headers});
  if(!res.ok) throw new Error('Unable to load article');
  const rows=await res.json(); if(!rows.length) throw new Error('Story not found');
  const post=rows[0]; document.title=`${post.title} | The Corner`;
  const description=document.querySelector('meta[name="description"]'); if(description) description.setAttribute('content',post.dek||'A story from The Corner.');
  const reading=post.metadata&&post.metadata.reading_time_minutes?`${post.metadata.reading_time_minutes} min read`:'Short read';
  const category=String(post.category||'Story').replaceAll('-',' ');
  const safeBody=sanitizeArticleHTML(post.body_html);
  root.innerHTML=`<section class="story-hero"><div class="reader"><div class="eyebrow">${esc(category)}</div><h1 class="serif">${esc(post.title)}</h1><p class="dek">${esc(post.dek)}</p><div class="meta">${esc(post.author_name||'Future Champs')} · ${date(post.published_at)} · ${esc(reading)}</div></div></section><article class="article"><div class="reader">${safeBody}<a class="back" href="/blog/">← Return to The Corner</a></div></article>`;
 }catch(_){root.innerHTML='<div class="reader error"><h1 class="serif">Story unavailable.</h1><p>This article may have moved or may still be under review.</p><a class="back" href="/blog/">← Return to The Corner</a></div>';}
}
loadArticle();
</script>
</body></html>
